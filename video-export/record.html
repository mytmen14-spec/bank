<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a14;color:#fff;font-family:'Montserrat',sans-serif;overflow:hidden}
#app{width:100vw;height:100vh;position:relative}
#three-container{position:absolute;inset:0}
#record-canvas{position:absolute;inset:0;pointer-events:none;opacity:0.2}
.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:12px;align-items:center;background:rgba(10,22,40,0.9);border:1px solid #1a3a5c;border-radius:12px;padding:12px 20px;backdrop-filter:blur(8px)}
.btn{padding:10px 24px;border-radius:8px;border:none;font-weight:bold;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;transition:all 0.2s}
.btn-record{background:#dc2626;color:#fff}
.btn-record:hover{background:#ef4444}
.btn-record:disabled{background:#4b5563;cursor:not-allowed}
.btn-stop{background:#ff6a00;color:#fff}
.btn-stop:hover{background:#ff8c00}
.status{font-family:'JetBrains Mono',monospace;font-size:11px;color:#9ca3af}
.status.recording{color:#ef4444;animation:pulse 1s infinite}
.progress{font-family:'JetBrains Mono',monospace;font-size:11px;color:#ff6a00}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:60px;pointer-events:none;z-index:30}
.title{font-size:clamp(1.5rem,5vw,3.5rem);font-weight:900;text-align:center;text-shadow:0 0 30px rgba(255,106,0,0.2);white-space:pre-line;line-height:1.1}
.subtitle{font-size:clamp(0.75rem,2vw,1.1rem);color:rgba(255,106,0,0.8);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;margin-top:8px;text-align:center}
.big-num{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:30;pointer-events:none}
.big-num.active{display:flex}
.big-num-text{font-size:clamp(4rem,15vw,9rem);font-weight:900;font-family:'JetBrains Mono',monospace;color:#ff6a00;text-shadow:0 0 40px rgba(255,106,0,0.4)}
.rec-indicator{position:fixed;top:20px;right:20px;z-index:100;display:none;align-items:center;gap:8px;background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:6px}
.rec-indicator.active{display:flex}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#dc2626;animation:pulse 1s infinite}
.rec-label{color:#ef4444;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:bold}
</style>
</head>
<body>
<div id="app">

    <span class="rec-label">REC</span>

  </div>
  
  <div class="big-num" id="bigNum">
    <div class="big-num-text" id="bigNumText"></div>
  </div>
  
  <div class="controls" id="controls">
    <button class="btn btn-record" id="startBtn">🔴 НАЧАТЬ ЗАПИСЬ</button>
    <span class="status" id="status">Готов к записи</span>

let scene,camera,renderer,objs=[],clock,animId;
const container=document.getElementById('three-container');

function initThree(){
  scene=new THREE.Scene();scene.background=new THREE.Color(C.bg);
  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,500);
  camera.position.set(8,6,8);camera.lookAt(0,1,0);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x334466,0.7));
  const d=new THREE.DirectionalLight(0xffffff,0.6);d.position.set(5,10,7);scene.add(d);
  const p=new THREE.PointLight(C.orange,0.4,25);p.position.set(-3,5,-3);scene.add(p);
  animate();
}

function animate(){animId=requestAnimationFrame(animate);const t=clock.getElapsedTime();objs.forEach(o=>{if(o.userData.type==='rotate')o.rotation.y=t*0.3;if(o.userData.type==='pulse'){const s=1+Math.sin(t*3)*0.1;o.scale.set(s,s,s);}});renderer.render(scene,camera);}

function clearScene(){objs.forEach(o=>{scene.remove(o);if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose();}});objs=[];}

function box(x,y,z,w,h,d,col,opts={}){const g=new THREE.BoxGeometry(w,h,d);const m=new THREE.MeshLambertMaterial({color:col,flatShading:true,emissive:opts.emissive||0});const mesh=new THREE.Mesh(g,m);mesh.position.set(x,y,z);scene.add(mesh);objs.push(mesh);return mesh;}
function sphere(x,y,z,r,col,opts={}){const g=new THREE.SphereGeometry(r,opts.segments||12,opts.segments||8);const m=new THREE.MeshBasicMaterial({color:col,wireframe:opts.wireframe||false});const mesh=new THREE.Mesh(g,m);mesh.position.set(x,y,z);scene.add(mesh);objs.push(mesh);return mesh;}
function points(pos,col,size=0.05){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));const m=new THREE.PointsMaterial({color:col,size});const p=new THREE.Points(g,m);scene.add(p);objs.push(p);return p;}
function line(p1,p2,col,op=0.3){const g=new THREE.BufferGeometry().setFromPoints([p1,p2]);const m=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op});const l=new THREE.Line(g,m);scene.add(l);objs.push(l);return l;}
function ring(x,y,z,r1,r2,col){const g=new THREE.RingGeometry(r1,r2,24);const m=new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide});const mesh=new THREE.Mesh(g,m);mesh.position.set(x,y,z);scene.add(mesh);objs.push(mesh);return mesh;}

// ============ RECORDING ============
let mediaRecorder=null;
let recordedChunks=[];
let timeline=null;

function updateUI(idx){
  const s=SCENES[idx];
  const textEl=document.getElementById('textContent');
  const bigNumEl=document.getElementById('bigNum');
  
  if(s.text||s.sub){
    textEl.innerHTML=(s.text?'<h1 class="title">'+s.text+'</h1>':'')+(s.sub?'<p class="subtitle">'+s.sub+'</p>':'');
  } else {
    textEl.innerHTML='';
  }
  
  if(s.bigNum){
    bigNumEl.classList.add('active');
    document.getElementById('bigNumText').textContent=s.bigNum;
  } else {
    bigNumEl.classList.remove('active');
  }
}

function startRecording(){
  const canvas=renderer.domElement;
  const stream=canvas.captureStream(30);
  
  mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000});
  recordedChunks=[];
  
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data);};
  
  mediaRecorder.onstop=()=>{
    const blob=new Blob(recordedChunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='bank-heist.webm';
    a.click();
    URL.revokeObjectURL(url);
    
    document.getElementById('status').textContent='✅ Видео сохранено!';
    document.getElementById('status').className='status';
    document.getElementById('recIndicator').classList.remove('active');
    document.getElementById('startBtn').disabled=false;
    document.getElementById('startBtn').textContent='🔴 НАЧАТЬ ЗАПИСЬ';
  };
  
  mediaRecorder.start();
  
  document.getElementById('status').textContent='● ИДЁТ ЗАПИСЬ...';
  document.getElementById('status').className='status recording';
  document.getElementById('recIndicator').classList.add('active');
  document.getElementById('startBtn').disabled=true;
  document.getElementById('startBtn').textContent='⏺ ЗАПИСЬ...';
  
  // Запускаем анимацию
  startAnimation();
}

function startAnimation(){
  const totalDur=SCENES.reduce((a,s)=>a+s.dur,0);
  const startTime=Date.now();
  
  timeline=gsap.timeline({
    onUpdate:()=>{
      const elapsed=(Date.now()-startTime)/1000;
      const progress=Math.min(elapsed/totalDur,1);
      const idx=Math.min(Math.floor(progress*SCENES.length),SCENES.length-1);
      updateUI(idx);
      
      const remaining=Math.max(0,totalDur-elapsed);
      document.getElementById('progress').textContent=`${Math.floor(elapsed)}с / ${totalDur}с`;
      
      if(elapsed>=totalDur){
        stopRecording();
      }
    }
  });
  
  SCENES.forEach(s=>{
    timeline.call(()=>{clearScene();scene.background=new THREE.Color(C.bg);if(builders[s.id])builders[s.id]();});
    timeline.to({},{duration:s.dur});
  });
}

function stopRecording(){
  if(timeline){timeline.kill();timeline=null;}
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){
    mediaRecorder.stop();
  }
}

// ============ INIT ============
window.addEventListener('load',()=>{
  initThree();
  clearScene();
  if(builders[1])builders[1]();
  document.getElementById('startBtn').addEventListener('click',startRecording);
});

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
